version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "typescript"
          - "tsup"
          - "vitest"
          - "@vitest/*"
          - "size-limit"
          - "@size-limit/*"
          - "@types/*"
        update-types:
          - minor
          - patch
      changesets:
        patterns:
          - "@changesets/*"
    ignore:
      # docx is pinned deliberately: every bump changes generated OOXML and must
      # be reviewed against the golden snapshots by hand.
      - dependency-name: "docx"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

name: Feature request
description: Suggest markdown syntax, a Word feature, or an API that downword should support.
title: "[feat]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        downword's scope is "markdown in, a Word document a human would accept
        out, without anything leaving the browser". Requests that require a
        server are out of scope by design.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched [existing issues](https://github.com/kspr-technologies/downword/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: This does not require sending the user's document to a server.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What breaks or annoys you today?
    validations:
      required: true

  - type: textarea
    id: markdown-input
    attributes:
      label: Example markdown input
      description: The markdown you want to convert.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: desired-output
    attributes:
      label: Desired Word output
      description: >
        What should appear in Word? Be concrete — style names, numbering
        behaviour, whether it should be a real Word table/list/equation or just
        formatted text. Screenshots of the result you want are ideal.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Markdown syntax support
        - Word/OOXML output fidelity
        - Styling and theming
        - Math (TeX/OMML)
        - Diagrams (mermaid)
        - Images and media
        - API / TypeScript types
        - CLI
        - Performance or bundle size
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or API shapes you have tried.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a PR for this.
          required: false

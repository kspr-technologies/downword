name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PNPM_VERSION: "10.33.0"

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the "Version Packages" PR / push tags
      pull-requests: write # open and update that PR
      id-token: write # OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify before releasing
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      # Publish guard.
      #
      # `changesets/action` runs its `publish` script on ANY push to main that
      # has no pending changesets - that is how the merged "Version Packages"
      # PR triggers a release. While the packages are still on the placeholder
      # version 0.0.0 that would publish the unfinished T0 scaffold to npm the
      # first time anything lands on main (`changeset publish` only skips
      # `private` packages and versions already on the registry - there is no
      # special case for 0.0.0).
      #
      # An empty `publish` input puts the action in version-PR-only mode, so
      # the guard below disables publishing until the first real version bump
      # and then gets out of the way permanently.
      - name: Decide whether publishing is allowed
        id: gate
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "publish=" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::packages are still at the 0.0.0 scaffold version"
          else
            echo "publish=pnpm release" >> "$GITHUB_OUTPUT"
          fi

      # If there are changesets on main, this opens/updates a "Version Packages"
      # PR. When that PR is merged, this same workflow runs `pnpm release`
      # (build + `changeset publish`) and publishes to npm.
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: ${{ steps.gate.outputs.publish }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attaches a signed provenance attestation to every published package.
          # Requires the `id-token: write` permission above. Deliberately set
          # here and not in .npmrc so local `pnpm pack` still works.
          NPM_CONFIG_PROVENANCE: "true"

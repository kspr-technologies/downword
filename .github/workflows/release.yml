name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the "Version Packages" PR / push tags
      pull-requests: write # open and update that PR
      id-token: write # OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify before releasing
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      # If there are changesets on main, this opens/updates a "Version Packages"
      # PR. When that PR is merged, this same workflow runs `pnpm release`
      # (build + `changeset publish`) and publishes to npm.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attaches a signed provenance attestation to every published package.
          # Requires the `id-token: write` permission above. Deliberately set
          # here and not in .npmrc so local `pnpm pack` still works.
          NPM_CONFIG_PROVENANCE: "true"
